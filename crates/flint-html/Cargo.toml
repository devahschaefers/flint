[package]
name = "flint-html"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "svg", "woff", "floats", "complex-scripts"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "0.14.0"
anyrender_vello_cpu = "0.18.0"


[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
