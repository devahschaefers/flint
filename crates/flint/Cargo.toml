[package]
name = "flint"
version.workspace = true
edition.workspace = true

[dependencies]
flint-core = { path = "../flint-core" }
gpui-kit = "0.9.0"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
chrono = "0.4"
ammonia = "4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
futures = "0.3"
ureq = "3"
gpui-pre = { version = "=0.3.11", optional = true, features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.11", optional = true, features = ["test-support"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
# Debug aid: FLINT_SHOT=<file.png> saves the window's frame and quits (needs no screen-recording permission)
screenshots = ["dep:gpui-pre", "dep:gpui-pre-platform", "dep:image"]
